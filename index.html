<!DOCTYPE html><html><head><meta name=viewport content="width=device-width,initial-scale=1">
<style>
html,body{margin:0;padding:0;background:#020a14;color:#4da6ff;font-family:monospace}
.box{margin:4px;border:2px solid #0090ff;border-radius:14px;padding:8px;background:#081a2e}
h1{font-size:13px;text-align:center;margin:4px 0;color:#0090ff}
.tabs{display:flex;gap:4px}
.tab{flex:1;padding:8px;border-radius:8px;border:0;font-weight:bold;font-size:11px}
.on{background:#0090ff;color:#000}.off{background:#1a2a3a;color:#7aa}
.info{font-size:9px;background:#020f22;padding:6px;border-radius:6px;margin:6px 0;border:1px solid #0a2a4a}
.inp{width:100%;background:#000;color:#fff;border:1px solid #0090ff;border-radius:6px;padding:6px;font-size:9px;margin-top:4px;font-family:monospace;box-sizing:border-box}
.row{display:flex;justify-content:space-between;font-size:11px;color:#fff;font-weight:bold;margin:4px 0}
.row b{color:#0090ff}
.hash{font-size:7px;background:#020f22;padding:4px;border-radius:4px;word-break:break-all;margin:4px 0}
.btn{width:100%;padding:12px;background:#0090ff;color:#000;font-weight:bold;font-size:14px;border:0;border-radius:10px;margin:6px 0}
.log{height:120px;overflow:auto;background:#020f22;font-size:8px;padding:6px;border-radius:6px;border:1px solid #0a2a4a;line-height:12px}
</style></head><body>
<div class=box>
<h1>⚡ FUUNN ASIC V1 - 200 TH/s</h1>
<div class=tabs><button id=a class="tab on">BTC</button><button id=b class="tab off">DOGE</button><button id=c class="tab off">PROG</button></div>
<div class=info>
Wallet <span id=lab>BTC</span>:<br>
<input id=w class=inp value="bc1p778nn2...frc8x5" placeholder="Tempel alamat BTC / DOGE kamu disini">
<br><span style=color:#5a9ae0;font-size:7px>CHIP: 128 CORES | 1.2GHz | TARGET: 19 zeros</span>
</div>
<div class=row><span>H/s <b id=hs>0 TH/s</b></span><span>Nonce <b id=n>8415650</b></span><span>Best <b id=bst>0z</b></span></div>
<div class=hash id=hh>0000000000000000...</div>
<button id=go class=btn>▶ START ASIC</button>
<div style=font-size:8px;color:#5a9ae0>Temp <b id=t style=color:#0090ff>42°C</b> | Power 3420W | Fan <b id=f>4800 RPM</b></div>
<div id=lg class=log></div>
</div>
<script>
let R=0,T=0,B=0,N=8415650,C='BTC',t0=0;
let wallets={BTC:"bc1p778nn2...frc8x5",DOGE:"DDdp5Smb...Ej1D4"};
let a=document.getElementById('a'),b=document.getElementById('b'),c=document.getElementById('c');
let w=document.getElementById('w'),go=document.getElementById('go'),hh=document.getElementById('hh'),lg=document.getElementById('lg'),lab=document.getElementById('lab');
function L(m){lg.innerHTML='> '+m+'<br>'+lg.innerHTML}
function U(){
  a.className=C=='BTC'?'tab on':'tab off';b.className=C=='DOGE'?'tab on':'tab off';c.className=C=='PROG'?'tab on':'tab off';
  lab.innerText=C; 
  w.value=wallets[C];
  w.placeholder=C=='DOGE'?'Tempel alamat DOGE':'Tempel alamat BTC';
  go.innerText=R?'STOP MINING - '+C:'▶ START ASIC - '+C;
}
w.oninput=()=>{wallets[C]=w.value; localStorage.setItem('fuunn_'+C, w.value); L('Wallet '+C+' saved: '+w.value.slice(0,12)+'...')};
// load saved
try{
 if(localStorage.getItem('fuunn_BTC')) wallets.BTC=localStorage.getItem('fuunn_BTC');
 if(localStorage.getItem('fuunn_DOGE')) wallets.DOGE=localStorage.getItem('fuunn_DOGE');
}catch(e){}
a.onclick=()=>{C='BTC';U();L('Switch BTC')};b.onclick=()=>{C='DOGE';U();L('Switch DOGE')};c.onclick=()=>{C='PROG';U();L('Show Verilog: sha256_core 128x')};
function H(z){let s='0'.repeat(z);for(let i=0;i<64-z;i++)s+=Math.floor(Math.random()*16).toString(16);return s}
function loop(){if(!R)return;T+=128000000000;N+=128;document.getElementById('n').innerText=N.toLocaleString();let r=Math.random(),z=0;if(r>0.4)z=4;if(r>0.6)z=6;if(r>0.8)z=8;if(r>0.92)z=10;if(r>0.98)z=12;let h=H(z);hh.innerText=h;if(z>B){B=z;document.getElementById('bst').innerText=B+'z'}if(z>=4)L('[ASIC '+C+' '+wallets[C].slice(0,8)+'] '+z+' zeros '+h.slice(0,16)+'...');let e=(Date.now()-t0)/1000;document.getElementById('hs').innerText=(T/e/1e12).toFixed(2)+' TH/s';document.getElementById('t').innerText=(42+Math.floor(Math.random()*8))+'°C';document.getElementById('f').innerText=(4600+Math.floor(Math.random()*400))+' RPM';setTimeout(loop,30)}
go.onclick=()=>{if(!R){R=1;t0=Date.now();T=0;B=0;L('FUUNN ASIC V1 Power ON 128 cores Wallet:'+wallets[C]);loop()}else{R=0;L('Power OFF Best '+B+' zeros')}U()};U();L('Ready - Tempel wallet kamu dulu baru START');L('Wallet akan ke-save otomatis');
</script></body></html>
